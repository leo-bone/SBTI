<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · SBTI 人格测试</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Epilogue', system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0F0F0F;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      min-height: 100vh;
    }
    .code {
      font-family: 'Anton', sans-serif;
      font-size: clamp(80px, 20vw, 180px);
      line-height: 0.9;
      color: #E11D48;
      text-shadow: 0 0 40px rgba(225,29,72,0.6);
      letter-spacing: -2px;
    }
    .msg { margin: 16px 0 8px; font-size: clamp(18px, 4vw, 24px); font-weight: 700; color: #FB7185; }
    .sub { color: rgba(255,255,255,0.6); max-width: 420px; line-height: 1.6; margin-bottom: 32px; }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #E11D48;
      color: #fff;
      font-family: 'Anton', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      padding: 16px 40px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 30px rgba(225,29,72,0.5);
      transition: transform 0.2s;
    }
    a.btn:hover { transform: translateY(-3px) scale(1.03); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Epilogue:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="code">404</div>
  <div class="msg">这一题，没有标准答案</div>
  <div class="sub">你访问的页面好像走丢辣。回到首页，重新测一次你的人格吧。</div>
  <a class="btn" href="/">↺ 回到 SBTI</a>
</body>
</html>
